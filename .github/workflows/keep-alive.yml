name: Keep Render instance awake

on:
  schedule:
    # Every 10 minutes — Render's free tier sleeps after ~15 minutes with no traffic.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health-check endpoint
        run: curl -sf --max-time 20 "${{ vars.RENDER_APP_URL }}" || echo "Ping failed (instance may still be waking up)"
